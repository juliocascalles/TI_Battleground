<svg id="card-overlay-template" viewBox="0 0 768 512"
     xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"
     style="position:absolute; top:0; left:0; pointer-events:none;">
  <g id="zone-custo" data-zone="zone-custo">
    <circle cx="62.0" cy="61.0" r="58.0" fill="rgba(0,0,0,0.001)" stroke="#4fc3f7" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="62.0" y="61.0" text-anchor="middle" dominant-baseline="middle"
          font-family="Segoe UI, sans-serif" font-weight="bold" font-size="52.2"
          fill="#ffffff" class="stat-value">{{ custo }}</text>
  </g>
  <g id="zone-ataque" data-zone="zone-ataque">
    <circle cx="62.0" cy="396.0" r="58.0" fill="rgba(0,0,0,0.001)" stroke="#ff5252" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="62.0" y="396.0" text-anchor="middle" dominant-baseline="middle"
          font-family="Segoe UI, sans-serif" font-weight="bold" font-size="52.2"
          fill="#ffffff" class="stat-value">{{ ataque }}</text>
  </g>
  <g id="zone-defesa" data-zone="zone-defesa">
    <circle cx="708.0" cy="396.0" r="56.0" fill="rgba(0,0,0,0.001)" stroke="#69f0ae" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="708.0" y="396.0" text-anchor="middle" dominant-baseline="middle"
          font-family="Segoe UI, sans-serif" font-weight="bold" font-size="50.4"
          fill="#ffffff" class="stat-value">{{ defesa }}</text>
  </g>
  <g id="zone-modifiers" data-zone="zone-modifiers">
    <rect x="230" y="6" width="307" height="34" fill="rgba(0,0,0,0.001)" stroke="#ffffff" stroke-width="2" stroke-dasharray="8,5" rx="4"/>
    <text x="383.5" y="23.0" text-anchor="middle" dominant-baseline="middle"
          font-family="Segoe UI, sans-serif" font-size="12" fill="#ffd23c" class="zone-label">{{ modificadores (icones) }}</text>
  </g>
  <g id="zone-pj-tag" data-zone="zone-pj-tag">
    <rect x="4" y="128" width="136" height="30" fill="rgba(0,0,0,0.001)" stroke="#ffd23c" stroke-width="2" stroke-dasharray="8,5" rx="4"/>
    <text x="72.0" y="143.0" text-anchor="middle" dominant-baseline="middle"
          font-family="Segoe UI, sans-serif" font-size="12" fill="#ffd23c" class="zone-label">{{ PJ? }}</text>
  </g>
</svg>